<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="About Me" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .sans { font-family: 'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif; } .mono { font-family: 'JetBrains Mono','SF Mono',Consolas,'Liberation Mono',monospace; }
    .in { opacity: 0; animation: in .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes in { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: translateY(0); } }

    .n { font-size: 13px; font-weight: 700; letter-spacing: 2.4px; fill: #E4572E; }
    .t { font-size: 54px; font-weight: 900; letter-spacing: -1.6px; fill: #15130F; }
    .l { font-size: 12.5px; font-weight: 600; letter-spacing: 2.2px; fill: #6F675A; }
    .d1 { animation-delay: .05s; } .d2 { animation-delay: .18s; }
  </style>
  <rect x="0.75" y="0.75" width="1198.5" height="118.5" rx="24" fill="#F3EBDD" stroke="#DDD1BC" stroke-width="1.5"/>
  <g class="in d1">
    <circle cx="50" cy="38" r="4.5" fill="#E4572E"/>
    <text class="mono n" x="66" y="42.5">01 /</text>
    <text class="mono l" x="1152" y="42.5" text-anchor="end">WHO I AM</text>
  </g>
  <text class="sans t in d2" x="46" y="94">ABOUT ME<tspan fill="#E4572E">.</tspan></text>
</svg>

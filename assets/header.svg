<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-label="Hi, I'm Ibrahim Benkacem. Software Engineer working with .NET, Java, Spring Boot, Laravel, Next.js and Angular." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .sans { font-family: 'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif; }
    .mono { font-family: 'JetBrains Mono','SF Mono',Consolas,'Liberation Mono',monospace; }
    .hi   { font-size: 36px; font-weight: 800; letter-spacing: 1px; fill: #E4572E; }
    .name { font-size: 94px; font-weight: 900; letter-spacing: -2.5px; fill: #15130F; }
    .role { font-size: 15px; font-weight: 600; letter-spacing: 3.4px; fill: #6F675A; }
    .tag  { font-size: 12.5px; font-weight: 600; letter-spacing: 1.6px; fill: #15130F; }
    .chip { font-size: 13px; font-weight: 600; letter-spacing: .8px; }
    .t13  { font-size: 13px; }
    .t11  { font-size: 11px; fill: #6F675A; }
    .in { opacity: 0; animation: in .8s cubic-bezier(.2,.7,.2,1) forwards; }
    .d1{animation-delay:.05s} .d2{animation-delay:.18s} .d3{animation-delay:.32s} .d4{animation-delay:.46s} .d5{animation-delay:.6s}
    @keyframes in { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform: translateY(0); } }
    .f1 { animation: fl 7s ease-in-out infinite; }
    .f2 { animation: fl 6s ease-in-out infinite reverse; }
    .f3 { animation: fl 8s ease-in-out -2s infinite; }
    @keyframes fl { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: grow 1s cubic-bezier(.2,.7,.2,1) both; }
    .ln  { transform-box: fill-box; transform-origin: 0 50%; animation: wide .9s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    @keyframes wide { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .ch { fill-opacity: 0; animation: typ .01s step-start forwards; }
    @keyframes typ { to { fill-opacity: 1; } }
    .caret { fill: #E4572E; fill-opacity: 0; animation: bl 1.1s steps(1) infinite; }
    .blink { animation: bl 1.1s steps(1) infinite; }
    @keyframes bl { 0%,50% { fill-opacity:1; } 50.01%,100% { fill-opacity:0; } }
  </style>

  <path d="M0 450 V26 Q0 0 26 0 H1174 Q1200 0 1200 26 V450 Z" fill="#F3EBDD"/>
  <path d="M0.75 450 V26 Q0.75 0.75 26 0.75 H1174 Q1199.25 0.75 1199.25 26 V450" fill="none" stroke="#DDD1BC" stroke-width="1.5"/>

  <!-- left column -->
  <g class="in d1">
    <circle cx="70" cy="62" r="5" fill="#E4572E"/>
    <circle cx="70" cy="62" r="5" fill="none" stroke="#E4572E" stroke-width="1.5">
      <animate attributeName="r" values="5;14" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text class="mono tag" x="88" y="66.5">AVAILABLE FOR FREELANCE &amp; REMOTE WORK</text>
  </g>
  <text class="sans hi" x="62" y="146"><tspan class="ch" style="animation-delay:0.45s">H</tspan><tspan class="ch" style="animation-delay:0.52s">I</tspan><tspan class="ch" style="animation-delay:0.59s">, </tspan><tspan class="ch" style="animation-delay:0.66s">I</tspan><tspan class="ch" style="animation-delay:0.73s">'</tspan><tspan class="ch" style="animation-delay:0.80s">M</tspan></text>
  <text class="sans name" x="58" y="236"><tspan class="ch" style="animation-delay:1.05s">I</tspan><tspan class="ch" style="animation-delay:1.12s">B</tspan><tspan class="ch" style="animation-delay:1.19s">R</tspan><tspan class="ch" style="animation-delay:1.26s">A</tspan><tspan class="ch" style="animation-delay:1.33s">H</tspan><tspan class="ch" style="animation-delay:1.40s">I</tspan><tspan class="ch" style="animation-delay:1.47s">M</tspan></text>
  <text class="sans name" x="58" y="322"><tspan class="ch" style="animation-delay:1.72s">B</tspan><tspan class="ch" style="animation-delay:1.79s">E</tspan><tspan class="ch" style="animation-delay:1.86s">N</tspan><tspan class="ch" style="animation-delay:1.93s">K</tspan><tspan class="ch" style="animation-delay:2.00s">A</tspan><tspan class="ch" style="animation-delay:2.07s">C</tspan><tspan class="ch" style="animation-delay:2.14s">E</tspan><tspan class="ch" style="animation-delay:2.21s">M</tspan><tspan class="caret" dx="8" style="animation-delay:2.33s">_</tspan></text>
  <g class="in" style="animation-delay:2.43s">
    <text class="mono role" x="64" y="362">SOFTWARE ENGINEER</text>
    <rect x="64" y="382" width="66" height="32" rx="16" fill="#15130F" stroke="#15130F" stroke-width="1.6"/><text class="mono chip" x="97.0" y="402.5" text-anchor="middle" fill="#F3EBDD">.NET</text>
    <rect x="140" y="382" width="66" height="32" rx="16" fill="none" stroke="#15130F" stroke-width="1.6"/><text class="mono chip" x="173.0" y="402.5" text-anchor="middle" fill="#15130F">JAVA</text>
    <rect x="216" y="382" width="128" height="32" rx="16" fill="none" stroke="#15130F" stroke-width="1.6"/><text class="mono chip" x="280.0" y="402.5" text-anchor="middle" fill="#15130F">SPRING BOOT</text>
    <rect x="354" y="382" width="92" height="32" rx="16" fill="none" stroke="#15130F" stroke-width="1.6"/><text class="mono chip" x="400.0" y="402.5" text-anchor="middle" fill="#15130F">LARAVEL</text>
    <rect x="456" y="382" width="92" height="32" rx="16" fill="none" stroke="#15130F" stroke-width="1.6"/><text class="mono chip" x="502.0" y="402.5" text-anchor="middle" fill="#15130F">NEXT.JS</text>
    <rect x="558" y="382" width="92" height="32" rx="16" fill="none" stroke="#15130F" stroke-width="1.6"/><text class="mono chip" x="604.0" y="402.5" text-anchor="middle" fill="#15130F">ANGULAR</text>
    
  </g>


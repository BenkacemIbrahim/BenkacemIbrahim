      <circle cx="794" cy="113" r="6" fill="#6CC788" stroke="#15130F" stroke-width="1.5"/>
      <rect x="830" y="103" width="250" height="20" rx="10" fill="#EFE6D6"/>
      <text class="mono t11" x="955" y="117" text-anchor="middle">ibrahimbenkacem.vercel.app</text>

      <g>
        <rect class="ln" style="animation-delay:.9s" x="754" y="158" width="120" height="11" rx="5.5" fill="#E4572E"/>
        <rect class="ln" style="animation-delay:1.0s" x="754" y="182" width="190" height="11" rx="5.5" fill="#15130F"/>

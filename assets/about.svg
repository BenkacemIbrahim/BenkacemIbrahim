<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="About Ibrahim: Software Engineer. Focus on microservices, REST APIs and SaaS. Backend with Java, Spring Boot, .NET and Laravel. Frontend with Next.js, Angular and TypeScript. Learning Kubernetes, system design and AWS. Open to freelance and remote roles." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>

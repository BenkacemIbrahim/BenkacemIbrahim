    .em { font-size: 14px; letter-spacing: .4px; fill: #15130F; }
    .cr { animation: bl 1.1s steps(1) infinite; }
    @keyframes bl { 0%,50% { fill-opacity: 1; } 50.01%,100% { fill-opacity: 0; } }

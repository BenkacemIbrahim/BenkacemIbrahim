<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-label="Let's build something great. Say hello at benkacem.ibrahim.dev@gmail.com. Ibrahim Benkacem, Software Engineer." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><clipPath id="band"><path d="M0 282 H1200 V324 Q1200 350 1174 350 H26 Q0 350 0 324 Z"/></clipPath></defs>
  <style>
    .sans { font-family: 'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif; } .mono { font-family: 'JetBrains Mono','SF Mono',Consolas,'Liberation Mono',monospace; }
    .h  { font-size: 62px; font-weight: 900; letter-spacing: -2px; fill: #15130F; }
    .tg { font-size: 12.5px; font-weight: 600; letter-spacing: 1.6px; fill: #15130F; }
    .lb { font-size: 11.5px; font-weight: 600; letter-spacing: 1.8px; fill: #6F675A; }
    .m  { font-size: 15px; letter-spacing: .4px; fill: #15130F; }
    .c  { font-size: 12px; letter-spacing: 1.4px; fill: #6F675A; }
    .b  { font-size: 20px; font-weight: 800; letter-spacing: 3.5px; fill: #F3EBDD; }
    .mq { font-size: 21px; font-weight: 800; letter-spacing: 3px; fill: #F3EBDD; }
    .in { opacity: 0; animation: in .8s cubic-bezier(.2,.7,.2,1) forwards; }
    .d1{animation-delay:.05s} .d2{animation-delay:.2s} .d3{animation-delay:.35s} .d4{animation-delay:.5s}
    @keyframes in { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: translateY(0); } }
    .a { animation: nudge 2s ease-in-out infinite; }
    @keyframes nudge { 0%,100% { transform: translate(0,0); } 50% { transform: translate(3px,-3px); } }
  </style>

  <path d="M0 350 V26 Q0 0 26 0 H1174 Q1200 0 1200 26 V350 Z" fill="#F3EBDD"/>
  <path d="M0.75 282 V26 Q0.75 0.75 26 0.75 H1174 Q1199.25 0.75 1199.25 26 V282" fill="none" stroke="#DDD1BC" stroke-width="1.5"/>

  <g class="in d1">
    <circle cx="70" cy="64" r="5" fill="#E4572E"/>
    <circle cx="70" cy="64" r="5" fill="none" stroke="#E4572E" stroke-width="1.5">
      <animate attributeName="r" values="5;14" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text class="mono tg" x="88" y="68.5">LET'S WORK TOGETHER</text>
  </g>

  <text class="sans h in d2" x="46" y="156">LET'S BUILD</text>

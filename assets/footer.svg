    <rect x="852" y="58" width="300" height="76" rx="38" fill="#15130F"/>
    <circle cx="892" cy="96" r="5.5" fill="#E4572E"/>
    <text class="sans b" x="916" y="103">SAY HELLO</text>
    <g class="a"><path d="M1096 108 L1114 90 M1100 90 H1114 V104" fill="none" stroke="#E4572E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text class="mono lb" x="852" y="178">EMAIL</text>
    <text class="mono m" x="852" y="199">benkacem.ibrahim.dev@gmail.com</text>
    <text class="mono lb" x="852" y="228">PORTFOLIO</text>
    <text class="mono m" x="852" y="249">ibrahimbenkacem.vercel.app</text>
  </g>

  <path d="M0 282 H1200 V324 Q1200 350 1174 350 H26 Q0 350 0 324 Z" fill="#15130F"/>
